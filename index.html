<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F-TOPIK WORD BATTLE</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="questions.js?v=20261005"></script>
<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#eef0ff,#f7f2ff);
    color:#222;
}

.container{
    max-width:650px;
    margin:auto;
    padding:20px;
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:900;
    color:#6c35d9;
    margin:20px 0 5px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:25px;
    padding:25px;
    box-shadow:0 10px 35px rgba(80,40,150,.12);
}

input{
    width:100%;
    padding:15px;
    border:2px solid #ddd;
    border-radius:12px;
    font-size:16px;
    margin-bottom:12px;
    outline:none;
}

input:focus{
    border-color:#7546e8;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#673de6,#9b45d9);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

button:hover{
    opacity:.92;
}

.secondary{
    background:#eee;
    color:#333;
}

.room{
    text-align:center;
    font-size:38px;
    font-weight:900;
    letter-spacing:8px;
    color:#673de6;
    padding:15px;
}

.status{
    text-align:center;
    padding:15px;
    margin:15px 0;
    border-radius:12px;
    background:#f3efff;
    color:#6334c9;
}

.players{
    display:flex;
    gap:12px;
    margin-bottom:20px;
}

.player{
    flex:1;
    background:#f6f3ff;
    border-radius:15px;
    padding:15px;
    text-align:center;
}

.player-name{
    font-size:15px;
    color:#666;
}

.score{
    font-size:30px;
    font-weight:900;
    color:#6b36db;
}

.question-number{
    text-align:center;
    color:#777;
    margin-bottom:10px;
}

.timer{
    height:12px;
    background:#eee;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:25px;
}

.timer-bar{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#7c42ed,#bd42cf);
    transition:width 1s linear;
}

.word{
    text-align:center;
    font-size:46px;
    font-weight:900;
    margin:25px 0;
}

.answers{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.answer{
    background:white;
    color:#333;
    border:2px solid #e2dcef;
    min-height:65px;
}

.answer:hover{
    background:#f5f0ff;
}

.answer.correct{
    background:#27ae60;
    color:white;
    border-color:#27ae60;
}

.answer.wrong{
    background:#e74c3c;
    color:white;
    border-color:#e74c3c;
}

.hidden{
    display:none;
}

.result{
    text-align:center;
}

.trophy{
    font-size:70px;
}

.winner{
    font-size:28px;
    font-weight:900;
    color:#673de6;
    margin:15px 0;
}

.small{
    font-size:14px;
    color:#888;
    text-align:center;
    margin-top:15px;
}

@media(max-width:500px){
    .word{
        font-size:38px;
    }

    .answers{
        grid-template-columns:1fr;
    }

    .logo{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="logo">🇰🇷 F-TOPIK WORD BATTLE</div>
<div class="subtitle">1 vs 1 Korean Vocabulary Game</div>


<!-- START -->
<div id="startScreen" class="card">

    <h2>🎮 O‘yinni boshlash</h2>

    <input id="nameInput" placeholder="Ismingizni kiriting">

    <button onclick="createRoom()">
        🏠 Xona yaratish
    </button>

    <hr style="margin:25px 0;border:none;border-top:1px solid #eee">

    <input id="roomInput" placeholder="Xona kodini kiriting">

    <button onclick="joinRoom()">
        🚀 Xonaga qo‘shilish
    </button>

    <div class="small">
        1-o‘yinchi xona yaratadi. 2-o‘yinchi shu kod orqali kiradi.
    </div>

</div>


<!-- WAITING -->
<div id="waitingScreen" class="card hidden">

    <h2 style="text-align:center">🏠 Xona yaratildi</h2>

    <p style="text-align:center">
        Do‘stingizga quyidagi kodni yuboring:
    </p>

    <div id="roomCode" class="room">------</div>

    <div id="connectionStatus" class="status">
        ⏳ Ikkinchi o‘yinchi kutilmoqda...
    </div>

</div>


<!-- GAME -->
<div id="gameScreen" class="card hidden">

    <div class="players">

        <div class="player">
            <div id="hostName" class="player-name">Player 1</div>
            <div id="hostScore" class="score">0</div>
        </div>

        <div class="player">
            <div id="guestName" class="player-name">Player 2</div>
            <div id="guestScore" class="score">0</div>
        </div>

    </div>

    <div id="questionNumber" class="question-number">
        1 / 10
    </div>

    <div class="timer">
        <div id="timerBar" class="timer-bar"></div>
    </div>

    <div id="word" class="word">
        학교
    </div>

    <div id="answers" class="answers"></div>

</div>


<!-- RESULT -->
<div id="resultScreen" class="card hidden result">

    <div class="trophy">🏆</div>

    <h2>O‘yin tugadi!</h2>

    <div id="winner" class="winner"></div>

    <div id="finalScore"></div>

    <button onclick="location.reload()">
        🔄 Yana o‘ynash
    </button>

</div>

</div>


<script>

const shuffledWordBank = [...wordBank]
    .sort(() => Math.random() - 0.5)
    .slice(0, 10);

let questions = shuffledWordBank.map(item => {

    const wrongAnswers = wordBank
        .filter(x => x.uzbek !== item.uzbek)
        .sort(() => Math.random() - 0.5)
        .slice(0, 3)
        .map(x => x.uzbek);

    const answers = [
        item.uzbek,
        ...wrongAnswers
    ].sort(() => Math.random() - 0.5);

    return {
        word: item.korean,
        answers: answers,
        correct: item.uzbek
    };

});

let peer = null;
let connection = null;

let isHost = false;

let myName = "";
let opponentName = "";

let myScore = 0;
let opponentScore = 0;

let currentQuestion = 0;
let answered = false;
let hostAnswered = false;
let guestAnswered = false;

let timer = null;
let timeLeft = 15;

let roomCode = "";


/* =========================
   RANDOM ROOM CODE
========================= */

function generateCode(){

    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for(let i=0;i<6;i++){
        result += chars[Math.floor(Math.random()*chars.length)];
    }

    return result;
}


/* =========================
   CREATE ROOM
========================= */

function createRoom(){

    myName = document.getElementById("nameInput").value.trim();

    if(!myName){
        alert("Avval ismingizni kiriting!");
        return;
    }

    isHost = true;

    roomCode = generateCode();

    peer = new Peer(roomCode.toLowerCase());

    peer.on("open", function(id){

        document.getElementById("startScreen").classList.add("hidden");

        document.getElementById("waitingScreen").classList.remove("hidden");

        document.getElementById("roomCode").textContent =
            roomCode;

    });


    peer.on("connection", function(conn){

        connection = conn;

        setupConnection();

    });


    peer.on("error", function(error){

        console.log(error);

        if(error.type === "unavailable-id"){

            peer.destroy();

            createRoom();

        }else{

            alert("Ulanishda xatolik: " + error.type);

        }

    });

}


/* =========================
   JOIN ROOM
========================= */

function joinRoom(){

    myName = document.getElementById("nameInput").value.trim();

    roomCode = document.getElementById("roomInput").value.trim().toUpperCase();

    if(!myName){

        alert("Avval ismingizni kiriting!");

        return;

    }

    if(!roomCode){

        alert("Xona kodini kiriting!");

        return;

    }

    isHost = false;

    peer = new Peer();

    peer.on("open", function(){

        connection = peer.connect(
            roomCode.toLowerCase(),
            {reliable:true}
        );

        setupConnection();

    });


    peer.on("error", function(error){

        alert("Xonaga ulanib bo‘lmadi. Kodni tekshiring.");

        console.log(error);

    });

}


/* =========================
   CONNECTION
========================= */

function setupConnection(){

    connection.on("open", function(){

        connection.send({

            type:"join",

            name:myName

        });


        if(isHost){

            document.getElementById("connectionStatus").textContent =
                "✅ Ikkinchi o‘yinchi qo‘shildi! O‘yin boshlanmoqda...";

        }

    });


    connection.on("data", function(data){

        handleData(data);

    });


    connection.on("close", function(){

        alert("Ikkinchi o‘yinchi o‘yindan chiqdi.");

    });

}


/* =========================
   DATA
========================= */

function handleData(data){


    if(data.type === "join"){

        opponentName = data.name;

        if(isHost){

            startGame();

        }

    }


    if(data.type === "start"){

        opponentName = data.hostName;

    questions = data.questions;

    startGame();

    }


    if(data.type === "score"){

    opponentScore = data.score;

    guestAnswered = true;

    updateScores();

    checkBothAnswered();

}


    if(data.type === "next"){

        currentQuestion = data.question;

        showQuestion();

    }


    if(data.type === "timeout"){

        // Faqat Host timeoutni qabul qiladi.
        if(isHost && data.question === currentQuestion && !hostAnswered){

            nextQuestion();

        }

    }


    if(data.type === "finish"){

        opponentScore = data.opponentScore;

        showResult(data.hostScore);

    }

}


/* =========================
   START GAME
========================= */

function startGame(){

    document.getElementById("waitingScreen").classList.add("hidden");

    document.getElementById("gameScreen").classList.remove("hidden");

    if(isHost){

        opponentName = opponentName || "Player 2";

        if(!Array.isArray(questions) || questions.length === 0){

            alert("Savollar yuklanmadi. Sahifani Ctrl + F5 bilan yangilang.");

            return;

        }

        connection.send({

            type:"start",

            hostName:myName,

            questions:questions

        });

    }

    document.getElementById("hostName").textContent =
        isHost ? myName : opponentName;

    document.getElementById("guestName").textContent =
        isHost ? opponentName : myName;

    currentQuestion = 0;

    showQuestion();

}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion(){

    answered = false;
    hostAnswered = false;
    guestAnswered = false;

    clearInterval(timer);

    if(currentQuestion >= questions.length){
        finishGame();
        return;
    }

    const q = questions[currentQuestion];

    if(!q){
        console.error("Savol topilmadi:", currentQuestion);
        return;
    }

    document.getElementById("questionNumber").textContent =
        (currentQuestion + 1) + " / " + questions.length;

    document.getElementById("word").textContent = q.word;

    const answersBox = document.getElementById("answers");
    answersBox.innerHTML = "";

    let answerList = Array.isArray(q.answers) ? [...q.answers] : [];

    // Agar 4 ta variant bo‘lmasa, questions.js dagi wordBankdan yaratadi
    if(answerList.length < 4 && typeof wordBank !== "undefined"){

        const wrongAnswers = wordBank
            .filter(x => x.uzbek !== q.correct)
            .sort(() => Math.random() - 0.5)
            .slice(0, 3)
            .map(x => x.uzbek);

        answerList = [q.correct, ...wrongAnswers];
    }

    answerList = [...new Set(answerList)];

    // 4 ta variant bo‘lishini ta’minlash
    if(answerList.length > 4){
        answerList = answerList.slice(0, 4);
    }

    answerList.sort(() => Math.random() - 0.5);

    answerList.forEach(answer => {

        const btn = document.createElement("button");

        btn.className = "answer";
        btn.type = "button";
        btn.textContent = answer;

        btn.onclick = function(){
            answerQuestion(answer, btn);
        };

        answersBox.appendChild(btn);
    });

    timeLeft = 15;
    updateTimer();

    timer = setInterval(function(){

        timeLeft--;
        updateTimer();

        if(timeLeft <= 0){

            clearInterval(timer);
            disableAnswers();

            // Host keyingi savolni o‘zi boshqaradi.
            if(isHost){

                nextQuestion();

            }else{

                // Guest Hostga timeout bo‘lganini bildiradi.
                if(connection){

                    connection.send({
                        type:"timeout",
                        question:currentQuestion
                    });

                }
            }
        }

    },1000);
}


/* =========================
   TIMER
========================= */

function updateTimer(){

    document.getElementById("timerBar").style.width =
        (timeLeft / 15 * 100) + "%";

}


/* =========================
   ANSWER
========================= */

function answerQuestion(answer, button){

    if(answered) return;

    answered = true;

    const correct =
        questions[currentQuestion].correct === answer;

    if(correct){

        button.classList.add("correct");

        myScore += 10;

    }else{

        button.classList.add("wrong");

        myScore += 0;

    }

    disableAnswers();

    updateScores();

    if(!isHost){

        connection.send({
            type:"score",
            score:myScore,
            question:currentQuestion
        });

    }

    if(isHost){

        hostAnswered = true;

        checkBothAnswered();

    }
}


function checkBothAnswered(){

    if(hostAnswered && guestAnswered){

        clearInterval(timer);

        setTimeout(function(){

            nextQuestion();

        },500);

    }
}
/* =========================
   DISABLE ANSWERS
========================= */

function disableAnswers(){

    document.querySelectorAll(".answer").forEach(btn => {

        btn.disabled = true;

    });

}


/* =========================
   UPDATE SCORE
========================= */

function updateScores(){

    document.getElementById("hostScore").textContent =
        isHost ? myScore : opponentScore;

    document.getElementById("guestScore").textContent =
        isHost ? opponentScore : myScore;

}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion(){

    clearInterval(timer);

    currentQuestion++;

    if(currentQuestion >= questions.length){

        finishGame();

        return;

    }

    if(isHost && connection){

        connection.send({

            type:"next",

            question:currentQuestion

        });

    }

    showQuestion();

}


/* =========================
   FINISH
========================= */

function finishGame(){

    clearInterval(timer);

    if(isHost){

        connection.send({

            type:"finish",

            hostScore:myScore,

            opponentScore:opponentScore

        });

    }

    showResult(isHost ? myScore : opponentScore);

}


/* =========================
   RESULT
========================= */

function showResult(hostFinalScore){

    document.getElementById("gameScreen").classList.add("hidden");

    document.getElementById("resultScreen").classList.remove("hidden");


    let player1Score =
        isHost ? myScore : hostFinalScore;

    let player2Score =
        isHost ? opponentScore : myScore;


    let winnerText = "";


    if(player1Score > player2Score){

        winnerText =
            "🏆 " +
            document.getElementById("hostName").textContent +
            " g‘olib!";

    }

    else if(player2Score > player1Score){

        winnerText =
            "🏆 " +
            document.getElementById("guestName").textContent +
            " g‘olib!";

    }

    else{

        winnerText = "🤝 Durrang!";

    }


    document.getElementById("winner").textContent =
        winnerText;


    document.getElementById("finalScore").innerHTML =
        "<h3>" +
        player1Score +
        " : " +
        player2Score +
        "</h3>";

}

</script>

</body>
</html>
